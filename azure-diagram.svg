<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1600" height="920" fill="#020617"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <!-- Title -->
  <circle cx="44" cy="46" r="6" fill="#34d399"/>
  <text x="62" y="52" fill="#e2e8f0" font-size="26" font-weight="700">Azure as a Platform Product — the two levers a technical PM owns</text>
  <text x="62" y="80" fill="#64748b" font-size="14">ARM is the single control plane every request passes through. The scope hierarchy is where governance is inherited.</text>

  <!-- ===================== LEFT: ARM CONTROL PLANE ===================== -->
  <text x="60" y="150" fill="#22d3ee" font-size="18" font-weight="700">1 · The control plane</text>

  <!-- clients -->
  <g>
    <rect x="60" y="190" width="150" height="54" rx="6" fill="#0f172a"/>
    <rect x="60" y="190" width="150" height="54" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="135" y="214" fill="#e2e8f0" font-size="13" text-anchor="middle">Portal</text>
    <text x="135" y="232" fill="#94a3b8" font-size="9" text-anchor="middle">humans</text>

    <rect x="60" y="256" width="150" height="54" rx="6" fill="#0f172a"/>
    <rect x="60" y="256" width="150" height="54" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="135" y="280" fill="#e2e8f0" font-size="13" text-anchor="middle">CLI / PowerShell</text>
    <text x="135" y="298" fill="#94a3b8" font-size="9" text-anchor="middle">scripts</text>

    <rect x="60" y="322" width="150" height="54" rx="6" fill="#0f172a"/>
    <rect x="60" y="322" width="150" height="54" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="135" y="346" fill="#e2e8f0" font-size="13" text-anchor="middle">SDK / REST</text>
    <text x="135" y="364" fill="#94a3b8" font-size="9" text-anchor="middle">apps</text>

    <rect x="60" y="388" width="150" height="54" rx="6" fill="#0f172a"/>
    <rect x="60" y="388" width="150" height="54" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="135" y="412" fill="#e2e8f0" font-size="13" text-anchor="middle">IaC: ARM / Bicep</text>
    <text x="135" y="430" fill="#94a3b8" font-size="9" text-anchor="middle">declarative</text>
  </g>

  <!-- arrows into ARM -->
  <line x1="210" y1="217" x2="330" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="283" x2="330" y2="305" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="349" x2="330" y2="315" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="415" x2="330" y2="330" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ARM box -->
  <rect x="332" y="250" width="180" height="140" rx="8" fill="#0f172a"/>
  <rect x="332" y="250" width="180" height="140" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="2"/>
  <text x="422" y="300" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle">Azure Resource</text>
  <text x="422" y="322" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle">Manager (ARM)</text>
  <text x="422" y="348" fill="#e2e8f0" font-size="10" text-anchor="middle">authN · authZ (RBAC)</text>
  <text x="422" y="364" fill="#e2e8f0" font-size="10" text-anchor="middle">Azure Policy checks</text>

  <!-- ARM to providers -->
  <line x1="512" y1="320" x2="620" y2="320" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="566" y="312" fill="#64748b" font-size="9" text-anchor="middle">routes to</text>

  <!-- resource providers -->
  <rect x="622" y="262" width="170" height="54" rx="6" fill="#0f172a"/>
  <rect x="622" y="262" width="170" height="54" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="707" y="286" fill="#e2e8f0" font-size="12" text-anchor="middle">Resource Providers</text>
  <text x="707" y="304" fill="#94a3b8" font-size="9" text-anchor="middle">Compute · Storage · Network</text>

  <rect x="622" y="328" width="170" height="54" rx="6" fill="#0f172a"/>
  <rect x="622" y="328" width="170" height="54" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="707" y="352" fill="#e2e8f0" font-size="12" text-anchor="middle">Data plane</text>
  <text x="707" y="370" fill="#94a3b8" font-size="9" text-anchor="middle">(uses the resource itself)</text>

  <text x="60" y="490" fill="#64748b" font-size="12">One authenticated choke point: set a rule here (RBAC + Policy) and no request can route around it.</text>

  <!-- ===================== RIGHT: SCOPE HIERARCHY ===================== -->
  <text x="900" y="150" fill="#fbbf24" font-size="18" font-weight="700">2 · The four scopes — governance is inherited downward</text>

  <!-- Management Group -->
  <rect x="900" y="175" width="640" height="150" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="920" y="200" fill="#fbbf24" font-size="14" font-weight="700">Management Group</text>
  <text x="920" y="218" fill="#94a3b8" font-size="10">org-wide compliance &amp; policy across many subscriptions</text>

  <!-- Subscription -->
  <rect x="930" y="232" width="580" height="86" rx="10" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="950" y="254" fill="#fb923c" font-size="13" font-weight="700">Subscription</text>
  <text x="950" y="271" fill="#94a3b8" font-size="9">billing + quota boundary · one per product line</text>

  <!-- Resource Group -->
  <rect x="965" y="282" width="520" height="28" rx="6" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="980" y="300" fill="#22d3ee" font-size="12" font-weight="700">Resource Group</text>
  <text x="1130" y="300" fill="#94a3b8" font-size="9">shared lifecycle: deployed / updated / deleted together</text>

  <!-- Resources row -->
  <g>
    <rect x="1215" y="286" width="58" height="20" rx="4" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="1244" y="300" fill="#e2e8f0" font-size="9" text-anchor="middle">VM</text>
    <rect x="1283" y="286" width="58" height="20" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="1312" y="300" fill="#e2e8f0" font-size="9" text-anchor="middle">DB</text>
    <rect x="1351" y="286" width="62" height="20" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="1382" y="300" fill="#e2e8f0" font-size="9" text-anchor="middle">Storage</text>
    <rect x="1423" y="286" width="52" height="20" rx="4" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
    <text x="1449" y="300" fill="#e2e8f0" font-size="9" text-anchor="middle">Net</text>
  </g>

  <!-- inheritance arrow -->
  <line x1="1520" y1="185" x2="1520" y2="315" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="1560" y="250" fill="#fbbf24" font-size="11" text-anchor="middle" transform="rotate(90 1560 250)">policy &amp; RBAC inherit ↓</text>

  <!-- landing zones note -->
  <rect x="900" y="360" width="640" height="120" rx="8" fill="#0f172a"/>
  <rect x="900" y="360" width="640" height="120" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="920" y="388" fill="#e2e8f0" font-size="13" font-weight="700">Why a PM cares</text>
  <text x="920" y="412" fill="#94a3b8" font-size="11">• Set a guardrail once at the top; every future team inherits it — no per-team policing.</text>
  <text x="920" y="434" fill="#94a3b8" font-size="11">• Cloud Adoption Framework "landing zones" ship this hierarchy as a default template.</text>
  <text x="920" y="456" fill="#94a3b8" font-size="11">• The same surface that enforces security also caps spend (reliable · secure · cost-efficient).</text>

  <!-- Legend -->
  <text x="60" y="560" fill="#64748b" font-size="12" font-weight="700">LEGEND</text>
  <rect x="60" y="572" width="16" height="12" rx="3" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="84" y="582" fill="#94a3b8" font-size="11">Control plane / scope</text>
  <rect x="260" y="572" width="16" height="12" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="284" y="582" fill="#94a3b8" font-size="11">Clients</text>
  <rect x="400" y="572" width="16" height="12" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="424" y="582" fill="#94a3b8" font-size="11">IaC / compute</text>
  <rect x="560" y="572" width="16" height="12" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="584" y="582" fill="#94a3b8" font-size="11">Providers / data</text>

  <text x="60" y="900" fill="#475569" font-size="11">mukundmurali.in/blog · Azure as a Platform Product</text>
</svg>
