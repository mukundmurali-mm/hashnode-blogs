<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'JetBrains Mono','SF Mono',Menlo,monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowCron" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#020617"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="46" fill="#e2e8f0" font-size="22" font-weight="700">Fitness Coach — Architecture</text>
  <text x="40" y="70" fill="#64748b" font-size="12">Fitbit Air data → local coaching engine → dashboard + live workouts</text>

  <!-- ===== Connections drawn early (behind boxes) ===== -->
  <!-- Fitbit -> Google Health -->
  <line x1="230" y1="150" x2="300" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Google Health -> sync -->
  <line x1="500" y1="150" x2="570" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- sync -> local JSON -->
  <line x1="700" y1="180" x2="700" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- local JSON -> data layer -->
  <line x1="700" y1="330" x2="700" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- data layer -> coaching engine -->
  <line x1="570" y1="415" x2="470" y2="415" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- data layer -> recommend -->
  <line x1="830" y1="415" x2="930" y2="415" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- coaching engine -> flask -->
  <line x1="360" y1="460" x2="360" y2="520" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- recommend -> flask -->
  <line x1="1000" y1="460" x2="1000" y2="500" stroke="#64748b" stroke-width="2"/>
  <line x1="1000" y1="500" x2="640" y2="500" stroke="#64748b" stroke-width="2"/>
  <line x1="640" y1="500" x2="640" y2="520" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- recommend -> youtube -->
  <line x1="1050" y1="380" x2="1050" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- cron auto-sync (orange dashed) -->
  <line x1="640" y1="110" x2="640" y2="130" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowCron)"/>
  <!-- telegram digest (orange dashed) from flask to telegram node -->
  <line x1="900" y1="555" x2="954" y2="555" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowCron)"/>

  <!-- ===== Nodes ===== -->
  <!-- Fitbit Air (external) -->
  <rect x="40" y="120" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="40" y="120" width="190" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="146" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Fitbit Air</text>
  <text x="135" y="164" fill="#94a3b8" font-size="9" text-anchor="middle">steps · sleep · RHR · HRV · MVPA</text>

  <!-- Google Health API (external/cloud) -->
  <rect x="300" y="120" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="300" y="120" width="200" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="146" fill="#fde68a" font-size="13" font-weight="600" text-anchor="middle">Google Health API</text>
  <text x="400" y="164" fill="#fbbf24" font-size="9" text-anchor="middle">OAuth2 · refresh token (~7d)</text>

  <!-- sync job -->
  <rect x="570" y="120" width="260" height="60" rx="6" fill="#0f172a"/>
  <rect x="570" y="120" width="260" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="700" y="146" fill="#a7f3d0" font-size="13" font-weight="600" text-anchor="middle">sync.py + reauth.py</text>
  <text x="700" y="164" fill="#34d399" font-size="9" text-anchor="middle">certifi TLS · pull daily metrics</text>

  <!-- YouTube (external) -->
  <rect x="955" y="120" width="205" height="60" rx="6" fill="#0f172a"/>
  <rect x="955" y="120" width="205" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1057" y="146" fill="#fecdd3" font-size="13" font-weight="600" text-anchor="middle">YouTube (yt-dlp)</text>
  <text x="1057" y="164" fill="#fb7185" font-size="9" text-anchor="middle">keyless ytsearch · no quota</text>

  <!-- local JSON store (database) -->
  <rect x="590" y="240" width="220" height="90" rx="6" fill="#0f172a"/>
  <rect x="590" y="240" width="220" height="90" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="700" y="278" fill="#ddd6fe" font-size="13" font-weight="600" text-anchor="middle">Local JSON store</text>
  <text x="700" y="298" fill="#a78bfa" font-size="9" text-anchor="middle">synced metrics · weight/waist log</text>
  <text x="700" y="314" fill="#a78bfa" font-size="9" text-anchor="middle">local-first · offline reads</text>

  <!-- data layer -->
  <rect x="570" y="380" width="260" height="70" rx="6" fill="#0f172a"/>
  <rect x="570" y="380" width="260" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="700" y="410" fill="#a7f3d0" font-size="13" font-weight="600" text-anchor="middle">health_data.py</text>
  <text x="700" y="430" fill="#34d399" font-size="9" text-anchor="middle">normalize daily metrics · never hits net</text>

  <!-- coaching engine -->
  <rect x="230" y="380" width="240" height="80" rx="6" fill="#0f172a"/>
  <rect x="230" y="380" width="240" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="410" fill="#a7f3d0" font-size="13" font-weight="600" text-anchor="middle">coach.py</text>
  <text x="350" y="429" fill="#34d399" font-size="9" text-anchor="middle">rules vs targets: 9k steps,</text>
  <text x="350" y="443" fill="#34d399" font-size="9" text-anchor="middle">30 MVPA, 7h sleep → ranked advice</text>

  <!-- recommend -->
  <rect x="930" y="380" width="240" height="80" rx="6" fill="#0f172a"/>
  <rect x="930" y="380" width="240" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1050" y="410" fill="#a7f3d0" font-size="13" font-weight="600" text-anchor="middle">recommend.py</text>
  <text x="1050" y="429" fill="#34d399" font-size="9" text-anchor="middle">weak-metric query →</text>
  <text x="1050" y="443" fill="#34d399" font-size="9" text-anchor="middle">Quick (&lt;=10m) / Full buckets</text>

  <!-- Flask app (frontend) -->
  <rect x="380" y="520" width="520" height="70" rx="6" fill="#0f172a"/>
  <rect x="380" y="520" width="520" height="70" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="640" y="550" fill="#a5f3fc" font-size="13" font-weight="600" text-anchor="middle">Flask + vanilla JS + Chart.js dashboard</text>
  <text x="640" y="570" fill="#22d3ee" font-size="9" text-anchor="middle">7-day cards · coach's read · trends · weight/waist · live workouts</text>

  <!-- Telegram digest node -->
  <rect x="955" y="525" width="205" height="60" rx="6" fill="#0f172a"/>
  <rect x="955" y="525" width="205" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1057" y="551" fill="#a5f3fc" font-size="13" font-weight="600" text-anchor="middle">Telegram digest</text>
  <text x="1057" y="569" fill="#22d3ee" font-size="9" text-anchor="middle">daily 6:30 AM coaching push</text>

  <!-- automation labels -->
  <text x="655" y="108" fill="#fb923c" font-size="9">cron: auto-sync every 6h</text>

  <!-- Legend -->
  <g font-size="9">
    <rect x="40" y="595" width="12" height="12" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
    <text x="58" y="605" fill="#94a3b8">External device</text>
    <rect x="180" y="595" width="12" height="12" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
    <text x="198" y="605" fill="#94a3b8">Cloud API</text>
    <rect x="300" y="595" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="318" y="605" fill="#94a3b8">Python module</text>
    <rect x="440" y="595" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="458" y="605" fill="#94a3b8">Local store</text>
    <rect x="560" y="595" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="578" y="605" fill="#94a3b8">Web app</text>
    <line x1="680" y1="601" x2="710" y2="601" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="716" y="605" fill="#94a3b8">Automation</text>
  </g>
</svg>
