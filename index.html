  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07090f;
      --bg2: #0c101a;
      --surface: #0f1623;
      --surface2: #141e30;
      --border: #1a2740;
      --border2: #223050;
      --text: #e4ecf7;
      --text2: #8496b0;
      --text3: #4d637d;
      --purple: #a78bfa;
      --purple2: #7c3aed;
      --blue: #60a5fa;
      --cyan: #22d3ee;
      --green: #34d399;
      --orange: #fb923c;
      --pink: #f472b6;
      --indigo: #818cf8;
      --r: 12px;
      --rl: 16px;
      --nav-bg: rgba(7, 9, 15, 0.82);
      --max-w: 1120px;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --bg2: #f1f5f9;
      --surface: #ffffff;
      --surface2: #f1f4f8;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --text: #0f172a;
      --text2: #475569;
      --text3: #94a3b8;
      --nav-bg: rgba(248, 250, 252, 0.88);
    }
    [data-theme="light"] .card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
    [data-theme="light"] .featured-banner:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
    [data-theme="light"] .featured-overlay { background: linear-gradient(to top, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.7) 40%, transparent 100%); }
    [data-theme="light"] .featured-overlay .feat-title,
    [data-theme="light"] .featured-overlay .feat-author { color: #0f172a; }
    [data-theme="light"] .featured-overlay .feat-meta,
    [data-theme="light"] .featured-overlay .feat-excerpt { color: #475569; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 60px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--purple2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .nav-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    /* Nav categories */
    .nav-categories {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav-categories::-webkit-scrollbar { display: none; }

    .nav-cat {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: 13.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.18s, background 0.18s;
      white-space: nowrap;
    }
    .nav-cat:hover { color: var(--text); background: var(--surface2); }
    .nav-cat.active { color: var(--text); font-weight: 600; }

    .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .theme-toggle {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s;
      flex-shrink: 0;
    }
    .theme-toggle:hover { color: var(--text); background: var(--surface2); }
    .icon-sun { display: none; }
    .icon-moon { display: block; }
    [data-theme="light"] .icon-sun { display: block; }
    [data-theme="light"] .icon-moon { display: none; }

    .nav-gh {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text2);
      text-decoration: none;
      transition: all 0.18s;
    }
    .nav-gh:hover { color: var(--text); background: var(--surface2); }

    /* ── FEATURED BANNER ── */
    .featured-banner {
      display: block;
      text-decoration: none;
      position: relative;
      width: 100%;
      max-width: var(--max-w);
      margin: 40px auto 0;
      border-radius: var(--rl);
      overflow: hidden;
      aspect-ratio: 21 / 9;
      transition: box-shadow 0.3s ease;
    }

    .featured-banner:hover {
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }

    .featured-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .featured-img-ph {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
    }

    .featured-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 48px 48px 40px;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.5) 50%, transparent 100%);
    }

    .featured-overlay .feat-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--purple);
      margin-bottom: 14px;
    }

    .featured-overlay .feat-title {
      font-size: clamp(22px, 3.2vw, 34px);
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.2;
      color: #fff;
      margin-bottom: 12px;
      max-width: 700px;
    }

    .featured-overlay .feat-excerpt {
      font-size: 15px;
      color: rgba(255,255,255,0.72);
      line-height: 1.6;
      max-width: 600px;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .featured-overlay .feat-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 14px;
    }

    .featured-overlay .feat-author {
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }

    .meta-sep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: 0.5; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .tag {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.2px;
    }

    /* ── MAIN ── */
    main {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 40px 100px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text3);
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .card {
      display: flex;
      flex-direction: column;
      border-radius: var(--r);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      text-decoration: none;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .card:hover {
      border-color: var(--border2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }

    .card-img {
      height: 240px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      aspect-ratio: 16 / 9;
    }

    .card-img img { width: 100%; height: 100%; object-fit: cover; }

    .card-img-ph {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }

    .card-body {
      padding: 24px 26px 26px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-date { font-size: 12px; color: var(--text3); margin-bottom: 8px; }

    .card-author {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-excerpt {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.6;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
    }

    .card-rt { font-size: 12px; color: var(--text3); }

    .card-tags { margin-top: 14px; }

    /* ── EMPTY ── */
    .empty {
      text-align: center;
      padding: 80px 32px;
      color: var(--text3);
      font-size: 15px;
    }

    /* ── FOOTER ── */
    .footer-wrap {
      border-top: 1px solid var(--border);
      padding: 36px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      max-width: var(--max-w);
      margin: 0 auto;
    }

    .footer-brand { font-size: 15px; font-weight: 700; color: var(--text); }
    .footer-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }

    .footer-links { display: flex; gap: 10px; }

    .fsocial {
      width: 36px; height: 36px;
      border-radius: 9px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text3);
      text-decoration: none;
      transition: all 0.18s;
    }
    .fsocial:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .grid { gap: 24px; }
      .featured-overlay { padding: 32px 32px 28px; }
      .featured-banner { aspect-ratio: 16 / 9; margin-top: 28px; }
    }

    @media (max-width: 700px) {
      nav { padding: 0 20px; gap: 8px; }
      .nav-categories { display: none; }
      .mobile-filters { display: flex !important; }
      main { padding-left: 20px; padding-right: 20px; }
      .grid { grid-template-columns: 1fr; gap: 22px; }
      .featured-banner { border-radius: 12px; margin: 20px 16px 0; width: calc(100% - 32px); aspect-ratio: 16 / 10; }
      .featured-overlay { padding: 24px 24px 22px; }
      .featured-overlay .feat-title { font-size: 20px; }
      .featured-overlay .feat-excerpt { display: none; }
      .card-img { height: 200px; }
      .footer-wrap { padding: 32px 20px; }
    }

    /* Mobile filter bar - shown only on mobile */
    .mobile-filters {
      display: none;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 16px 20px 0;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .mobile-filters::-webkit-scrollbar { display: none; }

    .mobile-filters .nav-cat {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 12.5px;
    }
    .mobile-filters .nav-cat.active {
      border-color: var(--purple);
      color: var(--purple);
      background: rgba(167,139,250,0.08);
    }
  </style>
</head>

  const COLORS = {
    ai: '#a78bfa', llm: '#a78bfa', mcp: '#a78bfa', 'mcp-server': '#a78bfa',
    rag: '#a78bfa', 'fine-tuning': '#a78bfa',
    'ai-agents': '#c084fc', 'agentic-ai': '#c084fc', 'claude-code': '#f472b6',
    oci: '#60a5fa', 'oracle-cloud': '#60a5fa', cloud: '#60a5fa',
    steampipe: '#818cf8', terraform: '#818cf8',
    networking: '#22d3ee', 'palo-alto-networks': '#22d3ee',
    devops: '#38bdf8', terminal: '#38bdf8', cli: '#38bdf8',
    productivity: '#34d399', obsidian: '#34d399', notebooklm: '#34d399',
    research: '#34d399', 'note-taking': '#34d399',
    ollama: '#fb923c', llama: '#fb923c', streamlit: '#fb923c',
    promptengineering: '#fbbf24', chatgpt: '#fbbf24', bard: '#fbbf24',
    'context-engineering': '#fbbf24'
  };

  const FILTER_MAP = {
    ai:          t => ['ai','llm','mcp','mcp-server','ai-agents','agentic-ai','claude-code','ollama'].includes(t),
    oci:         t => ['oci','oracle-cloud','cloud','steampipe','terraform'].includes(t),
    agentic:     t => ['agentic-ai','claude-code','ollama','ai-agents'].includes(t),
    networking:  t => ['networking','palo-alto-networks'].includes(t),
    productivity:t => ['productivity','obsidian','notebooklm','note-taking','research'].includes(t),
    devops:      t => ['devops','terminal','cli'].includes(t)
  };

  const BG_MAP = {
    ai:      'linear-gradient(135deg,#1a1040,#0d1a50)',
    oci:     'linear-gradient(135deg,#071430,#0a2045)',
    networking:'linear-gradient(135deg,#001a30,#003050)',
    productivity:'linear-gradient(135deg,#001a20,#003028)',
    devops:  'linear-gradient(135deg,#0a1520,#001a30)',
    default: 'linear-gradient(135deg,#0f1623,#141e30)'
  };

  const EMOJI_MAP = {
    ai: '🤖', llm: '🤖', mcp: '🔌', 'ai-agents': '🧠', 'agentic-ai': '🧠',
    'claude-code': '⚡', oci: '☁️', cloud: '☁️', networking: '🌐',
    'palo-alto-networks': '🔒', devops: '⚙️', terminal: '💻', cli: '💻',
    productivity: '🧠', obsidian: '💎', notebooklm: '📚', research: '🔬',
    ollama: '🦙', streamlit: '🚀', promptengineering: '✍️'
  };

  function tagColor(t) { return COLORS[t] || '#8496b0'; }

  function tagEl(t) {
    const c = tagColor(t);
    return `<span class="tag" style="background:${c}18;color:${c};border:1px solid ${c}28">${t}</span>`;
  }

  function fmtDate(d) {
    return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function postBg(tags) {
    for (const [k, fn] of Object.entries(FILTER_MAP)) {
      if (tags.some(fn)) return BG_MAP[k] || BG_MAP.default;
    }
    return BG_MAP.default;
  }

  function postEmoji(tags) {
    for (const t of tags) {
      if (EMOJI_MAP[t]) return EMOJI_MAP[t];
    }
    return '📝';
  }

  function renderFeatured(p) {
    const imgEl = p.cover
      ? `<img src="${p.cover}" alt="${p.title}" loading="eager" onerror="this.parentElement.innerHTML='<div class=featured-img-ph style=\\'background:${postBg(p.tags)}\\'>${postEmoji(p.tags)}</div>'">`
      : `<div class="featured-img-ph" style="background:${postBg(p.tags)}">${postEmoji(p.tags)}</div>`;

    return `
      <a href="post.html?id=${p.id}" class="featured-banner">
        ${imgEl}
        <div class="featured-overlay">
          <div class="feat-label">Latest</div>
          <h2 class="feat-title">${p.title}</h2>
          <p class="feat-excerpt">${p.excerpt}</p>
          <div class="feat-meta">
            <span class="feat-author">Mukund Murali</span>
            <span class="meta-sep"></span>
            <span>${fmtDate(p.date)}</span>
            <span class="meta-sep"></span>
            <span>${p.readTime} min read</span>
          </div>
          <div class="tags">${p.tags.slice(0, 4).map(tagEl).join('')}</div>
        </div>
      </a>`;
  }

  function renderCard(p) {
    const imgEl = p.cover
      ? `<img src="${p.cover}" alt="${p.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=card-img-ph style=\\'background:${postBg(p.tags)}\\'>${postEmoji(p.tags)}</div>'">`
      : `<div class="card-img-ph" style="background:${postBg(p.tags)}">${postEmoji(p.tags)}</div>`;

    return `
      <a href="post.html?id=${p.id}" class="card">
        <div class="card-img">${imgEl}</div>
        <div class="card-body">
          <div class="card-author">Mukund Murali</div>
          <div class="card-date">${fmtDate(p.date)} · ${p.readTime} min read</div>
          <div class="card-title">${p.title}</div>
          <div class="card-excerpt">${p.excerpt}</div>
          <div class="card-tags tags">${p.tags.slice(0, 3).map(tagEl).join('')}</div>
        </div>
      </a>`;
  }

  function render(filter) {
    const filtered = filter === 'all'
      ? POSTS
      : POSTS.filter(p => p.tags.some(FILTER_MAP[filter] || (() => false)));

    const featuredContainer = document.getElementById('featured-container');
    const main = document.getElementById('main');

    if (!filtered.length) {
      featuredContainer.innerHTML = '';
      main.innerHTML = '<div class="empty">No posts found for this filter.</div>';
      return;
    }

    const [first, ...rest] = filtered;
    featuredContainer.innerHTML = renderFeatured(first);

    main.innerHTML = rest.length ? `
      <div class="section-header" style="margin-top:80px">
        <span class="section-label">All articles</span>
        <div class="section-line"></div>
      </div>
      <div class="grid">${rest.map(renderCard).join('')}</div>
    ` : '';
  }

  // Bind filter clicks for both nav and mobile
  function bindFilters(container) {
    container.querySelectorAll('.nav-cat').forEach(btn => {
      btn.addEventListener('click', () => {
        // Sync active state across both nav and mobile
        document.querySelectorAll('.nav-cat').forEach(b => b.classList.remove('active'));
        document.querySelectorAll(`.nav-cat[data-filter="${btn.dataset.filter}"]`).forEach(b => b.classList.add('active'));
        render(btn.dataset.filter);
      });
    });
  }

  bindFilters(document.getElementById('nav-cats'));
  bindFilters(document.getElementById('mobile-cats'));

  render('all');

  // Theme toggle
  document.getElementById('theme-toggle').addEventListener('click', function() {
    const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('blog-theme', t);
  });
</script>
