<text x="70" y="52" font-family="Liberation Sans" font-size="30" font-weight="bold" fill="#f0f6fc" text-anchor="start">Always-On Agent: Thin Client, Thick Server</text>
<text x="70" y="80" font-family="Liberation Sans" font-size="15" font-weight="normal" fill="#8b949e" text-anchor="start">The agent runs server-side and keeps working while you&#x27;re away; the client only renders.</text>
