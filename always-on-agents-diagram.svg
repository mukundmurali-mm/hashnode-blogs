<text x="395.0" y="456" font-family="Liberation Sans" font-size="14" font-weight="normal" fill="#e6edf3" text-anchor="middle">• your messages</text>
<text x="395.0" y="486" font-family="Liberation Sans" font-size="14" font-weight="normal" fill="#e6edf3" text-anchor="middle">   get priority</text>
