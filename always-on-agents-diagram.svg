<text x="1325.0" y="314" font-family="Liberation Sans" font-size="13" font-weight="normal" fill="#f3d9a3" text-anchor="middle">(Firecracker-style)</text>
<text x="1325.0" y="340" font-family="Liberation Sans" font-size="13" font-weight="normal" fill="#f3d9a3" text-anchor="middle">virtual desktops +</text>
<text x="1325.0" y="366" font-family="Liberation Sans" font-size="13" font-weight="normal" fill="#f3d9a3" text-anchor="middle">browser</text>
<text x="1325.0" y="392" font-family="Liberation Sans" font-size="13" font-weight="normal" fill="#f3d9a3" text-anchor="middle">snapshot / pause / wake</text>
