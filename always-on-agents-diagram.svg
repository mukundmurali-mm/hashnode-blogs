<rect x="1108" y="642" width="324" height="34" rx="6" fill="rgba(34,211,238,0.14)" stroke="#22d3ee" stroke-width="1"/>
<text x="1120" y="664" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="start">• scratchpad</text>
<text x="1428" y="664" font-family="Liberation Sans" font-size="11" font-weight="normal" fill="#8fd8e8" text-anchor="end">current working notes</text>
<rect x="1108" y="684" width="324" height="34" rx="6" fill="rgba(34,211,238,0.14)" stroke="#22d3ee" stroke-width="1"/>
