<text x="970.0" y="346" font-family="Liberation Sans" font-size="14" font-weight="normal" fill="#9fe7c7" text-anchor="middle">model calls tools, repeatedly</text>
<text x="970.0" y="368" font-family="Liberation Sans" font-size="12" font-weight="normal" fill="#7fcfae" text-anchor="middle">(reason → act → observe → repeat)</text>
