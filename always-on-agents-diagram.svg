<text x="395.0" y="334" font-family="Liberation Sans" font-size="18" font-weight="bold" fill="#fb923c" text-anchor="middle">ROUTER</text>
<text x="395.0" y="366" font-family="Liberation Sans" font-size="14" font-weight="normal" fill="#e6edf3" text-anchor="middle">• dedupes events</text>
<text x="395.0" y="396" font-family="Liberation Sans" font-size="14" font-weight="normal" fill="#e6edf3" text-anchor="middle">• interrupt human</text>
