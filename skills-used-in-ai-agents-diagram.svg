<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148,163,184,0.06)" stroke-width="0.5"/>
    </pattern>
    <!-- Arrowhead markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#020617"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- ==================== ARROWS (drawn first, behind everything) ==================== -->

  <!-- Top layer flow arrows: Reasoning → Planning → Tool Use -->
  <line x1="270" y1="72" x2="308" y2="72" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)"/>
  <line x1="478" y1="72" x2="516" y2="72" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>

  <!-- Vertical arrows: Top layers down to composability -->
  <line x1="165" y1="92" x2="165" y2="148" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" marker-end="url(#arrow-cyan)"/>
  <line x1="393" y1="92" x2="315" y2="148" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" marker-end="url(#arrow-emerald)"/>
  <line x1="620" y1="92" x2="465" y2="148" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" marker-end="url(#arrow-emerald)"/>

  <!-- Agent → Skill arrows -->
  <line x1="240" y1="190" x2="210" y2="230" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)"/>
  <line x1="340" y1="190" x2="370" y2="230" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)"/>

  <!-- Skill → Tool arrows -->
  <line x1="160" y1="270" x2="130" y2="310" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>
  <line x1="210" y1="270" x2="240" y2="310" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>
  <line x1="370" y1="270" x2="350" y2="310" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>
  <line x1="420" y1="270" x2="460" y2="310" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>

  <!-- Memory stack connection arrow -->
  <line x1="570" y1="200" x2="620" y2="200" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-violet)"/>

  <!-- ==================== CONTEXT WINDOW (amber boundary) ==================== -->
  <rect x="30" y="30" width="740" height="430" rx="10" fill="#0f172a" stroke="none"/>
  <rect x="30" y="30" width="740" height="430" rx="10" fill="rgba(120,53,15,0.08)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="400" y="22" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600" opacity="0.8">CONTEXT WINDOW</text>

  <!-- ==================== META-SKILLS (rose border inside context) ==================== -->
  <rect x="50" y="45" width="555" height="400" rx="8" fill="#0f172a" stroke="none"/>
  <rect x="50" y="45" width="555" height="400" rx="8" fill="rgba(136,19,55,0.12)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Meta-skills labels around the border -->
  <text x="72" y="62" fill="#fb7185" font-size="8" font-weight="600">META-SKILLS</text>
  <text x="72" y="440" fill="#fb7185" font-size="7.5" opacity="0.8">Self-Reflection</text>
  <text x="210" y="440" fill="#fb7185" font-size="7.5" opacity="0.8">Error Recovery</text>
  <text x="350" y="440" fill="#fb7185" font-size="7.5" opacity="0.8">Loop Detection</text>
  <text x="490" y="440" fill="#fb7185" font-size="7.5" opacity="0.8">Circuit Breaking</text>

  <!-- Meta-skill icons (small dots) -->
  <circle cx="66" cy="438" r="2" fill="#fb7185" opacity="0.6"/>
  <circle cx="204" cy="438" r="2" fill="#fb7185" opacity="0.6"/>
  <circle cx="344" cy="438" r="2" fill="#fb7185" opacity="0.6"/>
  <circle cx="484" cy="438" r="2" fill="#fb7185" opacity="0.6"/>

  <!-- ==================== TOP LAYER: Reasoning → Planning → Tool Use ==================== -->

  <!-- Reasoning & Deliberation -->
  <rect x="70" y="52" width="200" height="40" rx="6" fill="#0f172a"/>
  <rect x="70" y="52" width="200" height="40" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="76" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="600">Reasoning &amp; Deliberation</text>

  <!-- Planning & Control -->
  <rect x="310" y="52" width="170" height="40" rx="6" fill="#0f172a"/>
  <rect x="310" y="52" width="170" height="40" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="395" y="76" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Planning &amp; Control</text>

  <!-- Tool Use & Environment -->
  <rect x="520" y="52" width="200" height="40" rx="6" fill="#0f172a"/>
  <rect x="520" y="52" width="200" height="40" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="620" y="76" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Tool Use &amp; Environment</text>

  <!-- ==================== COMPOSABILITY HIERARCHY ==================== -->

  <!-- Section label -->
  <text x="290" y="118" text-anchor="middle" fill="#94a3b8" font-size="8" font-weight="500" opacity="0.7">COMPOSABILITY HIERARCHY</text>

  <!-- Agent node (cyan) -->
  <rect x="220" y="130" width="150" height="38" rx="6" fill="#0f172a"/>
  <rect x="220" y="130" width="150" height="38" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="240" y="149" r="4" fill="none" stroke="#22d3ee" stroke-width="1"/>
  <circle cx="240" y="149" r="1.5" fill="#22d3ee"/>
  <text x="300" y="153" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">Agent</text>

  <!-- Skill nodes (emerald) -->
  <rect x="110" y="235" width="150" height="38" rx="6" fill="#0f172a"/>
  <rect x="110" y="235" width="150" height="38" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="185" y="258" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Skill: Deploy</text>

  <rect x="320" y="235" width="150" height="38" rx="6" fill="#0f172a"/>
  <rect x="320" y="235" width="150" height="38" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="395" y="258" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Skill: Research</text>

  <!-- Tool nodes (smaller, cyan-tinted) -->
  <rect x="75" y="310" width="100" height="30" rx="5" fill="#0f172a"/>
  <rect x="75" y="310" width="100" height="30" rx="5" fill="rgba(8,51,68,0.25)" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <text x="125" y="329" text-anchor="middle" fill="#22d3ee" font-size="8" opacity="0.9">terminal()</text>

  <rect x="195" y="310" width="100" height="30" rx="5" fill="#0f172a"/>
  <rect x="195" y="310" width="100" height="30" rx="5" fill="rgba(8,51,68,0.25)" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <text x="245" y="329" text-anchor="middle" fill="#22d3ee" font-size="8" opacity="0.9">write_file()</text>

  <rect x="305" y="310" width="100" height="30" rx="5" fill="#0f172a"/>
  <rect x="305" y="310" width="100" height="30" rx="5" fill="rgba(8,51,68,0.25)" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <text x="355" y="329" text-anchor="middle" fill="#22d3ee" font-size="8" opacity="0.9">web_search()</text>

  <rect x="415" y="310" width="100" height="30" rx="5" fill="#0f172a"/>
  <rect x="415" y="310" width="100" height="30" rx="5" fill="rgba(8,51,68,0.25)" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <text x="465" y="329" text-anchor="middle" fill="#22d3ee" font-size="8" opacity="0.9">web_extract()</text>

  <!-- Workflow annotation -->
  <rect x="110" y="360" width="410" height="24" rx="4" fill="none" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.4"/>
  <text x="315" y="376" text-anchor="middle" fill="#34d399" font-size="7.5" opacity="0.6">Skills = Reusable Workflows combining multiple Tools</text>

  <!-- ==================== MEMORY STACK (violet, right side) ==================== -->
  <rect x="625" y="120" width="130" height="295" rx="8" fill="#0f172a"/>
  <rect x="625" y="120" width="130" height="295" rx="8" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="690" y="140" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">MEMORY STACK</text>

  <!-- Working Memory -->
  <rect x="638" y="155" width="104" height="48" rx="5" fill="#0f172a"/>
  <rect x="638" y="155" width="104" height="48" rx="5" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="690" y="175" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="500">Working</text>
  <text x="690" y="193" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="500">Memory</text>

  <!-- Down arrow -->
  <line x1="690" y1="203" x2="690" y2="218" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" marker-end="url(#arrow-violet)"/>

  <!-- Short-term -->
  <rect x="638" y="220" width="104" height="48" rx="5" fill="#0f172a"/>
  <rect x="638" y="220" width="104" height="48" rx="5" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="690" y="240" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="500">Short-term</text>
  <text x="690" y="258" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="500">Memory</text>

  <!-- Down arrow -->
  <line x1="690" y1="268" x2="690" y2="283" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" marker-end="url(#arrow-violet)"/>

  <!-- Long-term (RAG/Vector DB) -->
  <rect x="638" y="285" width="104" height="48" rx="5" fill="#0f172a"/>
  <rect x="638" y="285" width="104" height="48" rx="5" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="690" y="305" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="500">Long-term</text>
  <text x="690" y="323" text-anchor="middle" fill="#a78bfa" font-size="7" opacity="0.7">RAG / Vector DB</text>

  <!-- Down arrow -->
  <line x1="690" y1="333" x2="690" y2="348" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" marker-end="url(#arrow-violet)"/>

  <!-- Episodic Memory -->
  <rect x="638" y="350" width="104" height="48" rx="5" fill="#0f172a"/>
  <rect x="638" y="350" width="104" height="48" rx="5" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="690" y="370" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="500">Episodic</text>
  <text x="690" y="388" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="500">Memory</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="30" y="480" width="740" height="105" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(148,163,184,0.1)" stroke-width="1"/>
  <text x="55" y="502" fill="#94a3b8" font-size="9" font-weight="600">LEGEND</text>

  <!-- Row 1 -->
  <rect x="55" y="512" width="24" height="14" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="88" y="523" fill="#e2e8f0" font-size="8">Agent / Reasoning</text>

  <rect x="230" y="512" width="24" height="14" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="263" y="523" fill="#e2e8f0" font-size="8">Skills / Planning</text>

  <rect x="400" y="512" width="24" height="14" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="433" y="523" fill="#e2e8f0" font-size="8">Memory Stack</text>

  <!-- Row 2 -->
  <rect x="55" y="540" width="24" height="14" rx="3" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="88" y="551" fill="#e2e8f0" font-size="8">Context Window</text>

  <rect x="230" y="540" width="24" height="14" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="263" y="551" fill="#e2e8f0" font-size="8">Meta-Skills</text>

  <line x1="400" y1="547" x2="424" y2="547" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)"/>
  <text x="433" y="551" fill="#e2e8f0" font-size="8">Data Flow</text>

  <!-- Version tag -->
  <text x="720" y="575" text-anchor="end" fill="#475569" font-size="7">v1.0 · 2026</text>

</svg>